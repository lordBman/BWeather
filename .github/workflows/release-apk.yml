name: react-native-android-build-apk
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  install-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install npm dependencies
        run: |
          npm install
  build-android:
    needs: install-and-test
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v3
      - name: Install npm dependencies
        run: |
          npm install

      - name: Determine Version
        id: version
        shell: bash
        run: |
          MAJOR=1
          MINOR=0

          # ==========================================
          # Find latest tag for this major.minor
          # ==========================================

          LATEST_TAG=$(git tag -l "v${MAJOR}.${MINOR}.*" --sort=-v:refname | head -n 1)

          if [ -z "$LATEST_TAG" ]; then
            PATCH=0
          else
            PATCH=$(echo "$LATEST_TAG" | sed -E 's/^v[0-9]+\.[0-9]+\.([0-9]+)$/\1/')
            PATCH=$((PATCH + 1))
          fi

          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          TAG="v${VERSION}"

          # ==========================================
          # Android versionCode
          #
          # GitHub run_number always increases.
          # Add 100 so our first release starts
          # at 101 instead of 1.
          # ==========================================

          VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))

          echo "Version: $VERSION"
          echo "Tag: $TAG"
          echo "Version Code: $VERSION_CODE"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Create Git Tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$TAG"
          git push origin "$TAG"
      
      - name: Build Android Release
        run: |
          chmod +x android/gradlew && android/gradlew assembleRelease

      - name: Prepare Release Files
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          cp "android/app/build/outputs/apk/release/app-release.apk" "release/bweather-${VERSION}-android.apk"
          echo "Release files:"
          ls -lh release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: "release/bweather-${{ steps.version.outputs.version }}-android.apk"
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
